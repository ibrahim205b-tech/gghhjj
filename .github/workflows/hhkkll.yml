name: HHKKLL — test, build APK, run on emulator

on:
  push:
    paths:
      - 'hhkkll/**'
      - '.github/workflows/hhkkll.yml'
  pull_request:
    paths:
      - 'hhkkll/**'
      - '.github/workflows/hhkkll.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the APK as a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hhkkll-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Tests (engine, backend, app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hhkkll/backend/package-lock.json

      - name: Engine — analyze & test (dedup, 4 sections, supply/offline)
        working-directory: hhkkll/core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded

      - name: Backend — build & test (pipeline, verification rules, budget, API)
        working-directory: hhkkll/backend
        run: |
          npm ci
          npm test

      - name: App — analyze & widget tests (intro, full match, resume, offline)
        working-directory: hhkkll/app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test --reporter expanded

  seed-sources:
    name: Starter-pack source links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: hhkkll/backend
        run: |
          npm ci
          npx tsc -p .
          node dist/src/cli.js check-sources ../content/seed_questions.json

  build-apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - id: meta
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Optional release signing. Without these secrets the APK is signed with
      # the runner's debug key: installable, but each build has a different
      # key, so uninstall the old build before installing a new one.
      - name: Configure signing
        id: signing
        working-directory: hhkkll/app/android
        env:
          KEYSTORE_B64: ${{ secrets.HHKKLL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HHKKLL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HHKKLL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HHKKLL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
            echo "mode=release key" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug key (no signing secrets configured)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: hhkkll/app
        run: |
          flutter pub get
          flutter build apk --release --build-name=${{ steps.meta.outputs.version }} --build-number=${{ github.run_number }}
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/HHKKLL-${{ steps.meta.outputs.version }}.apk

      - name: Remove signing material
        if: always()
        run: rm -f hhkkll/app/android/key.properties hhkkll/app/android/app/upload-keystore.jks

      - name: Verify the APK (signature, name, package, permissions)
        run: |
          APK=dist/HHKKLL-${{ steps.meta.outputs.version }}.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK" | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^package:|application-label:|uses-permission|sdkVersion|native-code" badging.txt
          grep -q "package: name='com.hhkkll.quiz'" badging.txt
          grep -q "application-label:'HHKKLL'" badging.txt
          grep -q "android.permission.INTERNET" badging.txt
          unzip -l "$APK" | grep -E "flutter_assets/assets/(sounds/intro_boom.wav|data/seed_questions.json)"

      - uses: actions/upload-artifact@v4
        with:
          name: HHKKLL-apk
          path: dist/HHKKLL-${{ steps.meta.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          APK=dist/HHKKLL-${{ steps.meta.outputs.version }}.apk
          {
            echo "## HHKKLL APK ${{ steps.meta.outputs.version }}"
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$APK")\` |"
            echo "| Size | $(du -h "$APK" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| Signing | ${{ steps.signing.outputs.mode }} |"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  emulator:
    name: Install & launch on Android emulator
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HHKKLL-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            mkdir -p shots
            adb install -r dist/*.apk
            adb shell pm list packages | grep com.hhkkll.quiz
            adb logcat -c
            adb shell am start -W -n com.hhkkll.quiz/.MainActivity
            sleep 4 && adb exec-out screencap -p > shots/1_intro.png
            sleep 4 && adb exec-out screencap -p > shots/2_intro.png
            sleep 10 && adb exec-out screencap -p > shots/3_home.png
            adb shell pidof com.hhkkll.quiz
            adb logcat -d > shots/logcat.txt
            ! grep -E "FATAL EXCEPTION|AndroidRuntime: Process: com.hhkkll.quiz" shots/logcat.txt
            adb shell dumpsys activity activities | grep -m1 "com.hhkkll.quiz/.MainActivity"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HHKKLL-emulator-screenshots
          path: shots/
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-apk, emulator]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HHKKLL-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: hhkkll-v${{ needs.build-apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HHKKLL ${{ needs.build-apk.outputs.version }}
          prerelease: true
          files: dist/*.apk
          body: |
            HHKKLL — Ultimate Football Quiz (Android APK)

            Built, verified (apksigner + aapt2) and launched on an Android 14 emulator by GitHub Actions.
            Install: download the APK on your phone, open it and allow "install unknown apps".
