name: Sawti AI — deploy backend to Hugging Face Space

# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   HF_TOKEN       a Hugging Face *write* token of your (free) account
#   SAWTI_API_KEY  the private key the app will use (any long random string)
# Without them this workflow only prints what is missing - it never fakes a deploy.
on:
  workflow_dispatch:
  push:
    paths:
      - 'sawtiai/backend/app/**'
      - 'sawtiai/backend/Dockerfile'
      - 'sawtiai/backend/requirements*.txt'
      - 'sawtiai/backend/hf_space/**'
      - '.github/workflows/sawti-deploy-hf.yml'

permissions:
  contents: read

concurrency:
  group: sawti-deploy
  cancel-in-progress: false

env:
  SPACE_NAME: sawtiai

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check secrets
        id: secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SAWTI_API_KEY: ${{ secrets.SAWTI_API_KEY }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$SAWTI_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## ⚠️ Deployment skipped"
              echo "Add repository secrets **HF_TOKEN** (Hugging Face write token) and **SAWTI_API_KEY**."
              echo "See sawtiai/docs/DEPLOYMENT.md."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: '3.11'

      - name: Create / update Space
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SAWTI_API_KEY: ${{ secrets.SAWTI_API_KEY }}
        run: |
          pip install -q "huggingface_hub>=0.34"
          python - <<'PY'
          import os, shutil, tempfile
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          user = api.whoami()["name"]
          repo = f"{user}/{os.environ['SPACE_NAME']}"
          api.create_repo(repo, repo_type="space", space_sdk="docker", exist_ok=True, private=False)
          api.add_space_secret(repo, "SAWTI_API_KEY", os.environ["SAWTI_API_KEY"])
          api.add_space_variable(repo, "SAWTI_ENGINE", "silma")
          stage = tempfile.mkdtemp()
          src = "sawtiai/backend"
          for name in ("app", "Dockerfile", "requirements.txt", "requirements-silma.txt"):
              p = os.path.join(src, name)
              (shutil.copytree if os.path.isdir(p) else shutil.copy)(p, os.path.join(stage, name))
          shutil.copy(os.path.join(src, "hf_space", "README.md"), os.path.join(stage, "README.md"))
          for root, dirs, files in os.walk(stage):
              dirs[:] = [d for d in dirs if d != "__pycache__"]
          api.upload_folder(repo_id=repo, repo_type="space", folder_path=stage,
                            commit_message="Deploy Sawti AI backend from GitHub",
                            ignore_patterns=["**/__pycache__/**", "*.pyc", "*.wav", "*.mp3", "*.m4a", ".env*"])
          host = repo.replace("/", "-").replace("_", "-").replace(".", "-").lower()
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"repo={repo}\nurl=https://{host}.hf.space\n")
          print("deployed", repo)
          PY

      - name: Wait for the Space to build and start
        if: steps.secrets.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO: ${{ steps.deploy.outputs.repo }}
        run: |
          python - <<'PY'
          import os, time
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          end = time.time() + 75 * 60
          last = None
          while time.time() < end:
              rt = api.get_space_runtime(os.environ["REPO"])
              if rt.stage != last:
                  print(time.strftime("%H:%M:%S"), "stage:", rt.stage, "hardware:", rt.hardware, flush=True)
                  last = rt.stage
              if rt.stage == "RUNNING":
                  break
              if rt.stage in ("BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR", "NO_APP_FILE"):
                  raise SystemExit(f"Space failed: {rt.stage} {getattr(rt, 'raw', {}).get('errorMessage', '')}")
              time.sleep(20)
          else:
              raise SystemExit("Space did not reach RUNNING in time")
          PY

      - name: Live test of the deployed Space (real engine, from outside)
        if: steps.secrets.outputs.ready == 'true'
        env:
          SAWTI_API_KEY: ${{ secrets.SAWTI_API_KEY }}
        run: |
          pip install -q httpx
          mkdir -p /tmp/refpkg && cd /tmp/refpkg
          pip download --no-deps silma-tts==1.0.5 -q
          python -m zipfile -e silma_tts-1.0.5-py3-none-any.whl x
          cp x/silma_tts/infer/ref_audio_samples/ar.ref.24k.wav /tmp/ref.wav
          cd "$GITHUB_WORKSPACE"
          python sawtiai/tools/smoke_test.py --url "${{ steps.deploy.outputs.url }}" --sample /tmp/ref.wav \
            --transcript "ويدقق النظر في القرآن الكريم وسائر الكتب السماوية ويتبع مسالك الرسل العظام عليهم الصلاة والسلام." \
            --out live_out --engine-wait 1500 --job-timeout 1500
          {
            echo "## ✅ Backend live at ${{ steps.deploy.outputs.url }}"
            echo ""
            echo '```json'
            python -c "import json;r=json.load(open('live_out/smoke_report.json'));print(json.dumps({k:r[k] for k in ('ok','engine_ready_wait_s','files','total_seconds')},ensure_ascii=False,indent=1))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
