name: Build & Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Analyze & test (core, server, app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite (for FFI-based tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Core — pub get / analyze / test
        working-directory: packages/generator_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded

      - name: Server — pub get / analyze / test (multi-device sync e2e)
        working-directory: server
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter expanded

      - name: App — pub get / analyze / widget tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test --reporter expanded

  build-apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Signing secrets are optional. When ANDROID_KEYSTORE_BASE64 is not set the
      # release APK is signed with the debug key (installable test build only).
      - name: Configure release signing
        id: signing
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > key.properties
            echo "mode=release-signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug-signed (no signing secrets configured)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: app
        env:
          LICENSE_PUBKEY: ${{ secrets.LICENSE_PUBKEY }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define=LICENSE_PUBKEY="$LICENSE_PUBKEY"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/generator-os-release.apk

      - name: Remove signing material
        if: always()
        run: rm -f app/android/key.properties app/android/app/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: generator-os-release
          path: dist/generator-os-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          SIZE=$(du -h dist/generator-os-release.apk | cut -f1)
          SHA=$(sha256sum dist/generator-os-release.apk | cut -d' ' -f1)
          {
            echo "## ✅ Generator OS APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`generator-os-release.apk\` |"
            echo "| Size | $SIZE |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Signing | ${{ steps.signing.outputs.mode }} |"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            echo ""
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
