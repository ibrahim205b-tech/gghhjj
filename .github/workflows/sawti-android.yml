name: Sawti AI — Android APK

on:
  push:
    paths:
      - 'sawtiai/android_app/**'
      - 'sawtiai/backend/**'
      - '.github/workflows/sawti-android.yml'
  pull_request:
    paths:
      - 'sawtiai/android_app/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sawti-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  build:
    name: Analyze, test, build SawtiAI.apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sawtiai/android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Unit & widget tests
        run: flutter test --reporter expanded

      # Optional release signing from repository secrets. Without them the APK
      # is signed with the debug key: installable, but updates must keep using
      # the same key (see docs/DEPLOYMENT.md).
      - name: Configure release signing
        id: signing
        working-directory: sawtiai/android_app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
            printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
            echo "mode=release key" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug key (no signing secrets configured)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          # Not a secret: the public address of your backend, if you set the
          # repository *variable* SAWTI_SERVER_URL. The API key is never built in.
          SERVER_URL: ${{ vars.SAWTI_SERVER_URL }}
        run: |
          flutter build apk --release --dart-define=SAWTI_DEFAULT_SERVER_URL="$SERVER_URL"
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/SawtiAI.apk

      - name: Remove signing material
        if: always()
        working-directory: sawtiai/android_app/android
        run: rm -f key.properties app/upload-keystore.jks

      - name: Verify APK
        working-directory: dist
        run: |
          test -s SawtiAI.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging SawtiAI.apk | tee badging.txt | head -5
          grep -q "package: name='com.sawtiai.app'" badging.txt
          grep -q "application-label:'صوتي AI'" badging.txt
          grep -q "android.permission.RECORD_AUDIO" badging.txt
          "$BT/apksigner" verify --print-certs SawtiAI.apk | head -3
          unzip -l SawtiAI.apk | grep -E "lib/arm64-v8a/libflutter.so|lib/armeabi-v7a/libflutter.so"
          # privacy: no audio or model files packaged
          if unzip -l SawtiAI.apk | grep -Ei "\.(wav|mp3|m4a|pt|safetensors|onnx)$"; then echo "audio/model file found in APK"; exit 1; fi
          sha256sum SawtiAI.apk > SawtiAI.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SawtiAI-apk
          path: |
            dist/SawtiAI.apk
            dist/SawtiAI.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        working-directory: dist
        run: |
          {
            echo "## ✅ SawtiAI.apk"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`SawtiAI.apk\` |"
            echo "| Size | $(du -h SawtiAI.apk | cut -f1) |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 SawtiAI.apk.sha256)\` |"
            echo "| Signing | ${{ steps.signing.outputs.mode }} |"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            echo ""
            echo "Download: **Artifacts → SawtiAI-apk** at the bottom of this run page."
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Emulator end-to-end (real app ↔ real backend + engine)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup || true

      - name: Build & start backend (production image, real engine)
        run: |
          docker build -t sawti-backend sawtiai/backend
          KEY=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))")
          echo "::add-mask::$KEY"
          echo "SAWTI_API_KEY=$KEY" >> "$GITHUB_ENV"
          docker run -d --name sawti -p 7860:7860 -e SAWTI_API_KEY="$KEY" sawti-backend

      - name: Test voice sample (from the MIT-licensed SILMA package)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          mkdir -p /tmp/refpkg && cd /tmp/refpkg
          pip download --no-deps silma-tts==1.0.5 -q
          python3 -m zipfile -e silma_tts-1.0.5-py3-none-any.whl x
          ffmpeg -loglevel error -y -i x/silma_tts/infer/ref_audio_samples/ar.ref.24k.wav -c:a aac -b:a 48k /tmp/ref.m4a
          echo "SAMPLE_B64=$(base64 -w0 /tmp/ref.m4a)" >> "$GITHUB_ENV"
          ls -la /tmp/ref.m4a

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pre-build debug app
        working-directory: sawtiai/android_app
        run: flutter pub get && flutter build apk --debug

      - name: Wait for engine
        run: |
          for i in $(seq 1 90); do
            S=$(curl -s http://127.0.0.1:7860/health | python3 -c "import sys,json;print(json.load(sys.stdin)['engine_state'])" 2>/dev/null || echo down)
            echo "engine: $S"; [ "$S" = ready ] && exit 0; [ "$S" = failed ] && break; sleep 10
          done
          docker logs sawti | tail -50; exit 1

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: sawtiai/android_app
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant com.sawtiai.app android.permission.RECORD_AUDIO
            flutter test integration_test/app_flow_test.dart -d emulator-5554 --reporter expanded --dart-define=SAWTI_TEST_SERVER_URL=http://10.0.2.2:7860 --dart-define=SAWTI_TEST_API_KEY=$SAWTI_API_KEY --dart-define=SAWTI_TEST_SAMPLE_B64=$SAMPLE_B64 --dart-define=SAWTI_TEST_SAMPLE_EXT=m4a "--dart-define=SAWTI_TEST_TRANSCRIPT=ويدقق النظر في القرآن الكريم وسائر الكتب السماوية ويتبع مسالك الرسل العظام عليهم الصلاة والسلام."

      - name: Backend log (ids and timings only)
        if: always()
        run: docker logs sawti 2>&1 | tail -80
